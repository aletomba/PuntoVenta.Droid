openapi: 3.1.0
info:
  title: Punto de Venta API
  version: 0.1.0
  description: Contrato inicial del MVP POS. Los importes se expresan en centavos y las fechas en UTC.
servers:
  - url: http://localhost:4010
    description: Mock local
  - url: http://localhost:5039
    description: API local
tags:
  - name: Auth
  - name: Products
  - name: Sales
  - name: Cash close
  - name: Sync
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Renovar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sesión renovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Error'
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Listar productos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Productos del comercio autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Crear producto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Error'
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Actualizar producto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Eliminar producto (borrado lógico)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Producto eliminado
        '404':
          $ref: '#/components/responses/Error'
  /sales:
    get:
      tags: [Sales]
      operationId: listSales
      summary: Listar ventas
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Ventas dentro del rango solicitado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
    post:
      tags: [Sales]
      operationId: createSale
      summary: Registrar venta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleInput'
      responses:
        '201':
          description: Venta registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/Error'
  /sales/{id}/void:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Sales]
      operationId: voidSale
      summary: Anular venta y reponer stock (solo Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidSaleRequest'
      responses:
        '200':
          description: Venta anulada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /cash-close:
    get:
      tags: [Cash close]
      operationId: getCashClose
      summary: Obtener cierre de caja diario
      security:
        - bearerAuth: []
      parameters:
        - name: day
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Totales de ventas activas por medio de pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashClose'
  /sync/push:
    post:
      tags: [Sync]
      operationId: pushSync
      summary: Enviar productos y ventas pendientes de sincronización
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Resultado por elemento; repetir un GUID no duplica registros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
  /sync/pull:
    get:
      tags: [Sync]
      operationId: pullSync
      summary: Obtener productos modificados desde la última sincronización
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Productos actualizados y marca de tiempo para la siguiente consulta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error de validación, autenticación o recurso inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [invalid_request]
        message:
          type: string
          examples: [The request is invalid.]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresAt]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, updatedAt, isDeleted]
          properties:
            id:
              type: string
              format: uuid
            updatedAt:
              type: string
              format: date-time
            isDeleted:
              type: boolean
    ProductInput:
      type: object
      required: [name, priceCents, stock]
      properties:
        barcode:
          type: [string, 'null']
        name:
          type: string
          minLength: 1
          maxLength: 200
        priceCents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    Sale:
      allOf:
        - $ref: '#/components/schemas/SaleInput'
        - type: object
          required: [id, totalCents, status, date]
          properties:
            totalCents:
              type: integer
            status:
              type: string
              enum: [active, voided]
            date:
              type: string
              format: date-time
            voidedAt:
              type: [string, 'null']
              format: date-time
            voidedByUserId:
              type: [string, 'null']
              format: uuid
            voidReason:
              type: [string, 'null']
    SaleInput:
      type: object
      required: [id, paymentMethod, items]
      properties:
        id:
          type: string
          format: uuid
          description: GUID idempotente generado por el cliente.
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItemInput'
    SaleItemInput:
      type: object
      required: [id, description, quantity, unitPriceCents]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: [string, 'null']
          format: uuid
        description:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPriceCents:
          type: integer
          minimum: 0
    VoidSaleRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PaymentMethod:
      type: string
      enum: [cash, debit, credit, transfer, other]
    CashClose:
      type: object
      required: [day, totalCents, byPaymentMethod]
      properties:
        day:
          type: string
          format: date
        totalCents:
          type: integer
        byPaymentMethod:
          type: object
          additionalProperties:
            type: integer
    SyncPushRequest:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        sales:
          type: array
          items:
            $ref: '#/components/schemas/SaleInput'
    SyncPushResponse:
      type: object
      required: [acceptedIds, rejected]
      properties:
        acceptedIds:
          type: array
          items:
            type: string
            format: uuid
        rejected:
          type: array
          items:
            type: object
            required: [id, error]
            properties:
              id:
                type: string
                format: uuid
              error:
                $ref: '#/components/schemas/Error'
    SyncPullResponse:
      type: object
      required: [products, nextSince]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        nextSince:
          type: string
          format: date-time
