name: API

on:
  pull_request:
    paths:
      - "api/**"
      - "PuntoVenta.slnx"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "PuntoVenta.slnx"
      - ".github/workflows/api.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PuntoVenta.slnx
      - run: dotnet build PuntoVenta.slnx --no-restore
